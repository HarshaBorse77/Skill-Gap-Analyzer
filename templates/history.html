<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis History</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><div class="container nav"><h1>Analysis History</h1><a href="{{ url_for('index') }}">New Analysis</a></div></header>
<main class="container">
<section class="hero"><p class="eyebrow">SAVED REPORTS</p><h2>Your previous analyses</h2></section>
<section class="card table-wrap">
<table>
<thead><tr><th>Candidate</th><th>Role</th><th>Score</th><th>Date</th><th>Report</th></tr></thead>
<tbody>
{% for row in rows %}
<tr>
<td>{{ row["candidate"] }}</td><td>{{ row["role"] }}</td>
<td><strong>{{ row["score"] }}%</strong></td><td>{{ row["created_at"] }}</td>
<td><a href="{{ url_for('report', analysis_id=row['id']) }}">PDF</a></td>
</tr>
{% else %}
<tr><td colspan="5">No analyses yet.</td></tr>
{% endfor %}
</tbody>
</table>
</section>
</main>
</body>
</html>
